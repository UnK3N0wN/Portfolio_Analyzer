services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio_ai}
      POSTGRES_USER: ${DB_USER:-portfolio_ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfolio_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             gunicorn portfolio_ai.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data: